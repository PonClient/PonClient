<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PornClient — Вход</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at top right,
            rgba(255,122,0,.18),
            transparent 35%
        ),
        #070707;
}

.box {
    width: min(420px, calc(100% - 30px));
    padding: 35px;

    background: #111;
    border: 1px solid #292929;
    border-radius: 20px;

    box-shadow: 0 20px 70px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 10px;
}

.logo span {
    color: #ff7a00;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;

    background: #080808;
    color: white;

    border: 1px solid #292929;
    border-radius: 10px;

    outline: none;
}

input:focus {
    border-color: #ff7a00;
}

label {
    display: block;
    margin-top: 18px;

    color: #bbb;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;

    border: 0;
    border-radius: 10px;

    background: #ff7a00;
    color: #050505;

    font-weight: 800;
    cursor: pointer;

    transition: .2s;
}

button:hover {
    background: #ff9635;
    transform: translateY(-2px);
}

.switch {
    margin-top: 20px;

    text-align: center;
    color: #888;
    font-size: 14px;
}

.switch a {
    color: #ff7a00;
    cursor: pointer;
}

.message {
    min-height: 20px;
    margin-top: 15px;

    text-align: center;
    font-size: 14px;
    color: #ff9635;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        Porn<span>Client</span>
    </div>

    <div class="subtitle" id="title">
        Вход в аккаунт
    </div>

    <form id="authForm">

        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="example@mail.com"
            required
        >

        <label>Пароль</label>

        <input
            id="password"
            type="password"
            placeholder="Введите пароль"
            minlength="6"
            required
        >

        <button type="submit" id="submitButton">
            Войти
        </button>

    </form>

    <div class="switch">

        <span id="switchText">
            Нет аккаунта?
        </span>

        <a id="switchMode">
            Зарегистрироваться
        </a>

    </div>

    <div class="message" id="message"></div>

</div>


<script>

/* =========================
   НАСТРОЙКИ SUPABASE
========================= */

const SUPABASE_URL =
    "https://oqswqzfjpupiglxxspdt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_X6zOmQu9VGifel5RtBbFmg_ZsgDJ2eg";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ЭЛЕМЕНТЫ
========================= */

let registerMode = false;

const form =
    document.getElementById("authForm");

const title =
    document.getElementById("title");

const submitButton =
    document.getElementById("submitButton");

const switchMode =
    document.getElementById("switchMode");

const switchText =
    document.getElementById("switchText");

const message =
    document.getElementById("message");


/* =========================
   ПЕРЕКЛЮЧЕНИЕ
   ВХОД ↔ РЕГИСТРАЦИЯ
========================= */

switchMode.addEventListener("click", () => {

    registerMode = !registerMode;

    message.textContent = "";

    if (registerMode) {

        title.textContent =
            "Создание аккаунта";

        submitButton.textContent =
            "Зарегистрироваться";

        switchText.textContent =
            "Уже есть аккаунт?";

        switchMode.textContent =
            "Войти";

    } else {

        title.textContent =
            "Вход в аккаунт";

        submitButton.textContent =
            "Войти";

        switchText.textContent =
            "Нет аккаунта?";

        switchMode.textContent =
            "Зарегистрироваться";
    }

});


/* =========================
   РЕГИСТРАЦИЯ И ВХОД
========================= */

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    message.textContent =
        "Подождите...";


    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    /* ===== РЕГИСТРАЦИЯ ===== */

    if (registerMode) {

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    emailRedirectTo:
                        "https://pornclient.github.io/PornClient/login.html"

                }

            });


        if (error) {

            message.textContent =
                "Ошибка: " + error.message;

            return;
        }


        message.textContent =
            "Аккаунт создан! Проверьте почту для подтверждения.";

    }


    /* ===== ВХОД ===== */

    else {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            message.textContent =
                "Ошибка: " + error.message;

            return;
        }


        window.location.href =
            "account.html";

    }

});

</script>

</body>
</html>
